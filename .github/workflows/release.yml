name: 发布版本

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: '发版标签（例如 v6.1.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: plus-ui/package.json
          run_install: false
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: plus-ui/pnpm-lock.yaml
      - name: 构建前端
        working-directory: plus-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build:prod
      - name: 打包前端资源
        run: tar -czf frontend.tar.gz -C plus-ui/dist .
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          if-no-files-found: error

  backend:
    name: 构建后端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建后端
        run: mvn --batch-mode -Pprod -pl ruoyi-admin -am package
      - name: 上传后端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error

  deploy:
    name: 上传到服务器
    if: github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts/frontend
      - name: 下载后端构建产物
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts/backend
      - name: 配置 SSH
        env:
          UBUNTU_SSH_KEY: ${{ secrets.UBUNTU_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$UBUNTU_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host="$SERVER_HOST"
          if [ "$SERVER_PORT" != 22 ]; then host="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s ssh-ed25519 %s\n' "$host" 'AAAAC3NzaC1lZDI1NTE5AAAAIK5jrBooRs3uS/12yA+xzkLz/uhq6x9Dt0rOKcmVXBaN' > ~/.ssh/known_hosts
      - name: 上传文件并备份旧版 JAR
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "ubuntu@$SERVER_HOST" \
            'test -w /home/ubuntu/www/sites/plus/index && test -w /home/ubuntu/project/plus'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -P "$SERVER_PORT" \
            artifacts/frontend/frontend.tar.gz "ubuntu@$SERVER_HOST:/home/ubuntu/www/sites/plus/index/.frontend.tar.gz"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "ubuntu@$SERVER_HOST" \
            'set -eu; cd /home/ubuntu/www/sites/plus/index; tar -xzf .frontend.tar.gz; rm .frontend.tar.gz'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -P "$SERVER_PORT" \
            artifacts/backend/ruoyi-admin.jar "ubuntu@$SERVER_HOST:/home/ubuntu/project/plus/ruoyi-admin.jar.new"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$SERVER_PORT" "ubuntu@$SERVER_HOST" \
            'set -eu; cd /home/ubuntu/project/plus; if [ -e ruoyi-admin.jar ]; then backup="ruoyi-admin.jar.$(date +%Y%m%d%H%M%S)"; n=1; while [ -e "$backup" ]; do backup="ruoyi-admin.jar.$(date +%Y%m%d%H%M%S).$n"; n=$((n+1)); done; mv ruoyi-admin.jar "$backup"; fi; mv ruoyi-admin.jar.new ruoyi-admin.jar'

  release:
    name: 发布 GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts
      - name: 下载后端构建产物
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts
      - name: 发布版本
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/frontend.tar.gz artifacts/ruoyi-admin.jar \
            --target "$COMMIT_SHA" --title "$RELEASE_TAG" --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
